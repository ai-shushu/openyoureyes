<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
<title>Open Your Eyes</title>
<style>
:root { color-scheme: dark; --ok: #35c46a; --warn: #e0a458; --bad: #e35b5b; --blue: #1f6feb; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #000; color: #e8edf2; }
body { font: 14px/1.45 -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
button { font-family: inherit; }

/* ---------- 画面：占满整屏 ---------- */
.stage { position: fixed; inset: 0; background: #000; }
#preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.grid { position: absolute; inset: 0; pointer-events: none; display: none; }
.grid.on { display: block; }
.grid i { position: absolute; background: rgba(255,255,255,.22); }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .3s; }
.flash.on { opacity: .75; transition: none; }

/* ---------- 顶部 HUD：半透明，只放决策最相关的信息 ---------- */
.hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5;
  padding: calc(env(safe-area-inset-top) + 8px) 12px 18px;
  background: linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,0));
  display: flex; align-items: flex-start; gap: 10px; pointer-events: none;
}
.hud .l { flex: 1; min-width: 0; }
.line1 { display: flex; align-items: center; gap: 7px; font-size: 13px; }
.conn { margin-left: auto; font-size: 11px; padding: 1px 7px; border-radius: 9px; background: rgba(0,0,0,.35); color: #8b97a5; white-space: nowrap; }
.conn.on { color: var(--ok); } .conn.off { color: var(--bad); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7684; flex: none; }
.dot.connecting { background: var(--warn); }
.dot.live { background: var(--ok); }
.dot.error { background: var(--bad); }
.line2 { font-size: 12px; color: #b7c2ce; margin-top: 3px; font-variant-numeric: tabular-nums; }
.line2 b { font-weight: 600; }
.line2.guide { font-size: 14px; font-weight: 600; color: #e8edf2; margin: 4px 0 2px; }
.line2.guide.ok { color: #6ee7a0; }
.line2.guide.bad { color: #ffb36b; }
.good { color: var(--ok); } .mid { color: var(--warn); } .bad { color: var(--bad); }

/* 水平仪：气泡偏离中心表示镜头没有正对（俯拍时） */
.level { width: 54px; height: 54px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.45);
  position: relative; flex: none; background: rgba(0,0,0,.25); }
.level::before, .level::after { content: ""; position: absolute; background: rgba(255,255,255,.35); }
.level::before { left: 50%; top: 8px; bottom: 8px; width: 1px; }
.level::after { top: 50%; left: 8px; right: 8px; height: 1px; }
.level .ring { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
  border-radius: 50%; border: 1px dashed rgba(255,255,255,.5); }
.level .bub { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px;
  border-radius: 50%; background: var(--warn); transition: transform .08s linear, background .2s; }
.level .bub.good { background: var(--ok); }
.level .bub.bad { background: var(--bad); }

/* ---------- 底部操作区 ---------- */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 20px 18px calc(env(safe-area-inset-bottom) + 14px);
  background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.5));
  display: flex; align-items: center;
}
/* 底部只有几个小图标：手机是摆好的机位，不是相机，没有快门 */
.dock .grow { flex: 1; }
.round { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14);
  color: #fff; font-size: 16px; display: grid; place-items: center; backdrop-filter: blur(6px); margin-left: 12px; }
.round:first-child { margin-left: 0; }
.round:active { background: rgba(255,255,255,.3); }
.round.hide { display: none; }
.round.on { background: var(--warn); color: #111; }
.round small { font-size: 10px; font-weight: 700; margin-left: 1px; }
/* 前置补光：拍摄瞬间整屏变白照亮物体 */
.screenfill { position: fixed; inset: 0; z-index: 20; background: #fff; display: none; }
/* 画面中央的说明：摄像头打不开等需要用户动手的情况 */
.notice { position: fixed; left: 16px; right: 16px; top: 38%; z-index: 6; display: none; text-align: center;
  background: rgba(0,0,0,.78); border: 1px solid rgba(255,255,255,.18); border-radius: 14px; padding: 16px; font-size: 15px; line-height: 1.6; }
.notice.on { display: block; }
.notice b { color: var(--warn); font-size: 17px; display: block; margin-bottom: 6px; }
.notice button { margin-top: 10px; font: inherit; padding: 8px 16px; border-radius: 10px; border: 0; background: var(--blue); color: #fff; }
.screenfill.on { display: block; }
details.diag summary { font-size: 12px; color: #8b97a5; cursor: pointer; margin-bottom: 8px; }
/* ---------- 设置抽屉：非常用信息全部折叠在这里 ---------- */
.sheet-mask { position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,.35); display: none; }
.sheet-mask.on { display: block; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; max-height: 78vh; overflow-y: auto;
  background: #121820; border-radius: 16px 16px 0 0; border-top: 1px solid #263140;
  padding: 10px 16px calc(env(safe-area-inset-bottom) + 18px);
  transform: translateY(105%); transition: transform .22s ease;
}
.sheet.on { transform: none; }
.grab { width: 38px; height: 4px; border-radius: 2px; background: #3a4656; margin: 2px auto 12px; }
.sec { margin-bottom: 14px; }
.sec h3 { font-size: 12px; font-weight: 500; color: #8b97a5; margin: 0 0 7px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; padding: 9px 4px; font-size: 13px; background: #0b1015; color: #8b97a5;
  border: 1px solid #2a3644; border-radius: 10px; }
.seg button.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.row { display: flex; gap: 8px; align-items: center; }
input[type=text] { width: 100%; padding: 9px 11px; border-radius: 10px; border: 1px solid #2a3644;
  background: #0b1015; color: #e8edf2; font-size: 12px; outline: none; }
.btn { padding: 9px 14px; border-radius: 10px; border: 1px solid #2a3644; background: #0b1015;
  color: #e8edf2; font-size: 13px; white-space: nowrap; }
.btn.stop { background: #8a2c30; border-color: #8a2c30; }
.toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #c8d2dd; }
.toggle input { accent-color: var(--blue); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12px; }
.kv dt { color: #8b97a5; } .kv dd { margin: 0; color: #dfe6ee; font-variant-numeric: tabular-nums; word-break: break-all; }
.msg { color: var(--warn); font-size: 12px; white-space: pre-wrap; }
.note { color: #6f7c8b; font-size: 11px; line-height: 1.6; }
.toast { position: fixed; left: 50%; top: 45%; transform: translate(-50%,-50%); z-index: 8;
  background: rgba(0,0,0,.72); padding: 10px 16px; border-radius: 10px; font-size: 14px; display: none; text-align: center; }
.toast.on { display: block; }
/* Claude 请求拍照时的全屏提示 */
.count { position: fixed; inset: 0; z-index: 7; display: none; place-items: center; background: rgba(0,0,0,.25); }
.count.on { display: grid; }
.count b { font-size: 140px; font-weight: 700; color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,.6); line-height: 1; }
.count small { display: block; text-align: center; font-size: 15px; color: #dfe6ee; margin-top: 10px; }
</style>
</head>
<body>

<div class="stage">
  <canvas id="preview"></canvas>
  <div class="grid" id="grid">
    <i style="left:33.33%;top:0;bottom:0;width:1px"></i><i style="left:66.66%;top:0;bottom:0;width:1px"></i>
    <i style="top:33.33%;left:0;right:0;height:1px"></i><i style="top:66.66%;left:0;right:0;height:1px"></i>
  </div>
  <div class="flash" id="flash"></div>
</div>

<div class="hud">
  <div class="l">
    <div class="line1"><span class="dot" id="dot"></span><span id="title">后置</span><span id="status" style="color:#b7c2ce">准备中</span>
      <span class="conn" id="conn">连接电脑…</span></div>
    <div class="line2 guide" id="guide">正在连接电脑…</div>
    <div class="line2" id="pose">姿态：等待传感器…</div>
    <div class="line2" id="light"></div>
  </div>
  <div class="level" id="level"><div class="ring"></div><div class="bub" id="bub"></div></div>
</div>

<div class="toast" id="toast"></div>
<div class="count" id="count"><div><b id="countNum">📷</b><small>AI 想看</small></div></div>

<div class="screenfill" id="screenFill"></div>
<div class="notice" id="notice"></div>

<div class="dock">
  <button class="round" id="flip" aria-label="切换前后摄像头">⇄</button>
  <span class="grow"></span>
  <button class="round hide" id="torchBtn" aria-label="补光">⚡</button>
  <button class="round" id="more" aria-label="设置">⋯</button>
</div>

<div class="sheet-mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>

  <div class="sec">
    <h3>本机名称（多台手机时用来区分机位，如「俯拍」「侧拍」）</h3>
    <div class="row" style="gap:8px">
      <input id="phoneName" maxlength="16" placeholder="1 号机" style="flex:1;min-width:0;padding:9px 10px;border-radius:8px;border:1px solid #263140;background:#0b1015;color:#e8edf2;font:inherit">
      <button id="phoneNameSave" class="btn">保存</button>
    </div>
  </div>

  <div class="sec">
    <h3>摄像头</h3>
    <div class="seg"><button id="camFront">前置</button><button id="camBack" class="active">后置</button></div>
  </div>

  <div class="sec">
    <h3>补光</h3>
    <div class="seg" id="lseg"><button data-l="off">关</button><button data-l="auto">自动</button><button data-l="on">常亮</button></div>
    <div class="note" id="lightNote" style="margin-top:6px">—</div>
  </div>

  <div class="sec">
    <h3>画质（拍照按摄像头原始分辨率）</h3>
    <div class="seg" id="qseg">
      <button data-q="sd">540p</button><button data-q="hd">720p</button><button data-q="fhd">1080p</button>
    </div>
  </div>

  <div class="sec">
    <h3>辅助</h3>
    <div class="row" style="gap:18px">
      <label class="toggle"><input type="checkbox" id="gridT">三分线</label>
      <label class="toggle"><input type="checkbox" id="mirror">预览镜像</label>
    </div>
  </div>

  <div class="sec">
    <div class="msg" id="msg"></div>
  </div>

  <details class="sec diag">
    <summary>诊断信息</summary>
    <dl class="kv" id="sensorKv"></dl>
    <div class="note" id="note" style="margin-top:8px"></div>
    <div class="note" id="offline"></div>
  </details>
</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var el = {};
  ["dot","title","status","conn","pose","light","bub","toast","flip","torchBtn","more","mask","sheet",
   "camFront","camBack","lseg","lightNote","qseg","gridT","grid","mirror","msg","sensorKv","screenFill",
   "note","offline","preview","flash","count","countNum","phoneName","phoneNameSave","notice","guide"].forEach(function (k) { el[k] = $(k); });

  var FACE_KEY = "t9cam.facing", QUALITY_KEY = "t9cam.quality", GRID_KEY = "t9cam.grid";

  // 这台 T9 实测：源尺寸按「横向」申请，Chrome 给出旋正后的显示画面；720x1280 直接申请会 NotReadableError
  var QUALITY = {
    sd:  { label: "540×960",   w: 540,  h: 960,  srcW: 960,  srcH: 540,  fps: 20 },
    hd:  { label: "720×1280",  w: 720,  h: 1280, srcW: 1280, srcH: 720,  fps: 20 },
    fhd: { label: "1080×1920", w: 1080, h: 1920, srcW: 1920, srcH: 1080, fps: 20 }
  };

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // 配对密钥：扫电脑上的二维码进来时网址带 #k=…，存下来；之后发给电脑的每个请求都带上
  var PAIR_KEY = "t9cam.pair";
  (function () {
    var m = /[#&]k=([\w-]+)/.exec(location.hash);
    var mid = /[#&]id=([a-z0-9]+)/.exec(location.hash);   // 从旧端口搬过来时带着原来的编号，电脑才认得是同一台
    if (mid) lsSet("t9cam.phoneId", mid[1]);
    if (m || mid) { if (m) lsSet(PAIR_KEY, m[1]); try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
    var key = lsGet(PAIR_KEY), raw = window.fetch.bind(window);
    if (!key) return;
    window.fetch = function (url, opt) {
      if (typeof url === "string" && url.indexOf("/api/") !== -1 && (url.charAt(0) === "/" || url.indexOf(location.origin) === 0)) {
        opt = Object.assign({}, opt || {});
        opt.headers = Object.assign({}, opt.headers || {}, { "X-T9-Key": key });
      }
      return raw(url, opt);
    };
  })();

  var cfg = null, rawStream = null, srcVideo = null;
  var raf = 0, running = false, gen = 0, wakeLock = null;
  var facing = lsGet(FACE_KEY) === "user" ? "user" : "environment";
  var quality = QUALITY[lsGet(QUALITY_KEY)] ? lsGet(QUALITY_KEY) : "fhd";

  function faceName() { return facing === "user" ? "前置" : "后置"; }
  function setStatus(kind, text) { el.dot.className = "dot" + (kind ? " " + kind : ""); el.status.textContent = text; }
  function say(t) { el.msg.textContent = t || ""; }
  // 把手机上的异常报给电脑（写进页面服务日志），方便排查；失败就算了
  function report(t) {
    try {
      fetch(snapUrl().replace(/\/api\/snap$/, "/api/phone/log"), { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: typeof phoneId === "string" ? phoneId : "", msg: String(t).slice(0, 300) }) }).catch(function () {});
    } catch (e) {}
  }
  var toastT = 0;
  function toast(t, ms) {
    el.toast.textContent = t; el.toast.classList.add("on");
    clearTimeout(toastT); toastT = setTimeout(function () { el.toast.classList.remove("on"); }, ms || 1600);
  }
  function r1(x) { return x == null || isNaN(x) ? null : Math.round(x * 10) / 10; }
  function r3(x) { return x == null || isNaN(x) ? null : Math.round(x * 1000) / 1000; }

  // =====================================================================
  //  传感器：浏览器侧实时姿态 / 运动（拍照瞬间与照片一起保存）
  // =====================================================================
  var IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var S = {
    gravity: null,        // accelerationIncludingGravity，设备坐标系 m/s²
    linAcc: null,         // 去掉重力的线性加速度
    rotRate: null,        // 陀螺仪 °/s
    orient: null,         // deviceorientation alpha/beta/gamma
    orientAbs: null,      // deviceorientationabsolute（含罗盘）
    motionInterval: null,
    shakeBuf: [],         // 最近 1 秒的 |线性加速度| 与 |角速度|
    lux: null,
    battery: null
  };

  window.addEventListener("devicemotion", function (e) {
    var g = e.accelerationIncludingGravity, a = e.acceleration, r = e.rotationRate;
    // iOS Safari 的 accelerationIncludingGravity 符号与安卓 Chrome 相反（平放屏幕朝上：iOS z≈-9.8，安卓 z≈+9.8），统一成安卓约定
    if (g && g.x != null) S.gravity = IOS ? { x: -g.x, y: -g.y, z: -g.z } : { x: g.x, y: g.y, z: g.z };
    if (a && a.x != null) S.linAcc = { x: a.x, y: a.y, z: a.z };
    if (r && r.alpha != null) S.rotRate = { alpha: r.alpha, beta: r.beta, gamma: r.gamma };
    S.motionInterval = e.interval;
    var now = performance.now();
    var la = a && a.x != null ? Math.hypot(a.x, a.y, a.z) : null;
    var rr = r && r.alpha != null ? Math.hypot(r.alpha, r.beta, r.gamma) : null;
    S.shakeBuf.push({ t: now, a: la, r: rr });
    while (S.shakeBuf.length && now - S.shakeBuf[0].t > 1000) S.shakeBuf.shift();
  });
  window.addEventListener("deviceorientation", function (e) {
    if (e.beta != null) S.orient = { alpha: e.alpha, beta: e.beta, gamma: e.gamma, absolute: e.absolute };
  });
  window.addEventListener("deviceorientationabsolute", function (e) {
    if (e.alpha != null) S.orientAbs = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
  });

  // Generic Sensor 的环境光（多数 Chrome 默认关闭，能用就用）
  try {
    if ("AmbientLightSensor" in window) {
      var als = new AmbientLightSensor({ frequency: 2 });
      als.addEventListener("reading", function () { S.lux = als.illuminance; });
      als.start();
    }
  } catch (e) {}

  try {
    if (navigator.getBattery) navigator.getBattery().then(function (b) {
      function upd() { S.battery = { level: Math.round(b.level * 100), charging: b.charging }; }
      upd(); b.addEventListener("levelchange", upd); b.addEventListener("chargingchange", upd);
    });
  } catch (e) {}

  /* 由重力向量推算相机姿态（与照片畸变直接相关）：
   *   设备坐标：x 向右、y 向上（竖持时屏幕上沿方向）、z 垂直屏幕朝外。后置镜头朝 -z。
   *   tiltFromDown：后置镜头光轴与「正下方」的夹角。0° = 正俯拍（平放屏幕朝上），90° = 平视。
   *   俯拍时把重力在 x/y 上的分量换成前后、左右两个倾角，用来判断梯形畸变的方向。 */
  function pose() {
    var g = S.gravity;
    if (!g) return null;
    var n = Math.hypot(g.x, g.y, g.z) || 1;
    var gx = g.x / n, gy = g.y / n, gz = g.z / n;
    var back = facing !== "user";
    var axisZ = back ? gz : -gz;                      // 镜头光轴与重力反方向的投影
    var tiltFromDown = Math.acos(Math.max(-1, Math.min(1, axisZ))) * 180 / Math.PI;
    var deg = function (v) { return Math.asin(Math.max(-1, Math.min(1, v))) * 180 / Math.PI; };
    var p = {
      tiltFromDownDeg: r1(tiltFromDown),
      tiltFromLevelDeg: r1(90 - tiltFromDown),        // 平视时为 0，向下为正
      pitchFrontBackDeg: r1(deg(gy)),                 // 俯拍时：画面上沿方向抬高为正（上沿离物体更远 → 上窄下宽）
      rollLeftRightDeg: r1(deg(gx)),                  // 俯拍时：画面左右方向倾斜
      horizonRollDeg: r1(Math.atan2(gx, gy) * 180 / Math.PI) // 平视时：画面绕光轴旋转（地平线是否水平）
    };
    if (tiltFromDown < 45) {
      p.mode = "俯拍";
      p.errDeg = r1(tiltFromDown);
    } else if (tiltFromDown > 135) {
      p.mode = "仰拍";
      p.errDeg = r1(180 - tiltFromDown);
    } else {
      p.mode = "平视";
      p.errDeg = r1(Math.abs(90 - tiltFromDown));
    }
    var heading = S.orientAbs ? S.orientAbs.alpha : null;
    if (heading != null) p.compassDeg = r1((360 - heading) % 360);
    return p;
  }

  function shake() {
    var buf = S.shakeBuf;
    if (!buf.length) return null;
    var as = buf.map(function (b) { return b.a; }).filter(function (v) { return v != null; });
    var rs = buf.map(function (b) { return b.r; }).filter(function (v) { return v != null; });
    var mx = function (arr) { return arr.length ? Math.max.apply(null, arr) : null; };
    var avg = function (arr) { return arr.length ? arr.reduce(function (s, v) { return s + v; }, 0) / arr.length : null; };
    var rotMax = mx(rs), accMax = mx(as);
    var level = (rotMax != null && rotMax > 20) || (accMax != null && accMax > 0.8) ? "晃动"
              : (rotMax != null && rotMax > 5) || (accMax != null && accMax > 0.25) ? "轻微" : "稳定";
    return { windowMs: 1000, samples: buf.length, linAccMax: r3(accMax), linAccAvg: r3(avg(as)),
             rotRateMaxDegS: r1(rotMax), rotRateAvgDegS: r1(avg(rs)), verdict: level };
  }

  function cls(err) { return err == null ? "" : err <= 2 ? "good" : err <= 8 ? "mid" : "bad"; }

  // 光线：每 0.5 秒把画面缩到 48×48 算一次平均亮度和过曝/欠曝面积，几乎不耗电
  var L = null;   // { luma 0~255, pct 0~100, overPct, underPct, level, cls }
  var meterCanvas = null;

  function renderHud() {
    var p = pose(), s = shake();
    if (p) {
      // 镜头前只留一句大白话，细节放进设置里的「诊断信息」
      el.pose.innerHTML = p.mode + " · 偏 <b class='" + cls(p.errDeg) + "'>" + Math.round(p.errDeg) + "°</b>" +
        (s && s.verdict !== "稳定" ? " · <b class='" + (s.verdict === "轻微" ? "mid" : "bad") + "'>" + s.verdict + "</b>" : "");
      // 气泡：俯拍/仰拍时按两个倾角偏移；平视时用横滚 + 俯仰

      else { bx = p.rollLeftRightDeg; by = -p.pitchFrontBackDeg; }   // 气泡跑向偏高的一侧，和真实水平仪一致
      var k = 1.6, lim = 20;

      el.bub.style.transform = "translate(" + bx + "px," + by + "px)";

    } else if (!el.pose.dataset.fixed) {

        (ex.estLux != null ? " <span style='color:#8b97a5'>≈" + ex.estLux + " lx</span>" : S.lux != null ? " <span style='color:#8b97a5'>" + Math.round(S.lux) + " lx</span>" : "") +
        (torchOn ? " · <b class='mid'>补光中</b>" : "");
    } else {

  setInterval(renderHud, 150);

  function renderSensorKv(p, s) {
    var rows = [];
    function add(k, v) { if (v != null && v !== "") rows.push("<dt>" + k + "</dt><dd>" + v + "</dd>"); }

    if (p) {

      add("前后倾 / 左右倾", p.pitchFrontBackDeg + "° / " + p.rollLeftRightDeg + "°");
      add("画面旋转", p.horizonRollDeg + "°"); add("罗盘", p.compassDeg != null ? p.compassDeg + "°" : null);
    }
    if (S.gravity) add("重力 xyz", [S.gravity.x, S.gravity.y, S.gravity.z].map(function (v) { return v.toFixed(2); }).join(", "));
    if (s) { add("线加速度峰值", s.linAccMax + " m/s²"); add("角速度峰值", s.rotRateMaxDegS + " °/s"); }

      add("补光灯", torchCap ? (torchOn ? "支持 · 亮" : "支持 · 灭") : "不支持（" + faceName() + "）");

  }

  //  摄像头采集与绘制

  async function resolveDeviceId() {

      var hit = cams.find(function (d) {

      });
      if (!hit) {

      }

    } catch (e) { return null; }
  }

  function constraintLevels(deviceId) {
    var q = QUALITY[quality];

  }

  // 拍照取的是摄像头原始画面，不受预览帧率影响。点屏幕、晃动手机（在调角度）或收到请求时恢复正常帧率。

      setStatus("error", "不安全连接，无法用摄像头");
      el.pose.innerHTML = "请在电脑上的 Open Your Eyes 里点「＋ 添加机位」，用这台手机扫码，按提示操作";
      say("当前页面不是安全上下文（isSecureContext=false）。");

  // 摄像头打不开时告诉用户为什么、该怎么做（同时报给电脑，设置页「最近事件」能看到）
  var INAPP = /; wv\)|MicroMessenger|QQ\/|MQQBrowser|Weibo|DingTalk|AlipayClient|baiduboxapp/i.test(navigator.userAgent) ||

    var name = err && err.name, html;
    report("摄像头打不开：" + (name || "") + " " + (err && err.message || err || "") + (INAPP ? "（内置浏览器）" : ""));
    if (INAPP) {
      var inApp = /MicroMessenger|QQ\/|Weibo|DingTalk|AlipayClient|baiduboxapp/i.test(navigator.userAgent);
      html = "<b>请用" + (IOS ? " Safari " : " Chrome ") + "浏览器打开</b>" + (inApp
        ? "现在是在其它应用的内置浏览器里，它不让网页用摄像头。点右上角「⋯」选「在浏览器中打开」，或复制链接到" + (IOS ? " Safari" : " Chrome") + "。"
        : "这个浏览器不让网页使用摄像头（很多手机自带的浏览器都这样）。请复制链接，用 Chrome 打开；没有 Chrome 就在应用商店搜索「Chrome」安装。") +
        "<br><button id='copyUrl'>复制链接</button>";
    } else if (name === "NotAllowedError" || name === "SecurityError") {

    } else {

    el.notice.classList.add("on");

    if (c) c.addEventListener("click", function () {

        .catch(function () { prompt("长按复制这个链接：", location.href); });

    torchOn = false;   // 轨道停了灯也就灭了

  async function restartCamera(noTorch) {

    await new Promise(function (r) { setTimeout(r, 600); });
    await startCamera(noTorch);
  }

  // =====================================================================
  //  补光：后置用手机的手电筒（网页只能控制「常亮」，没有拍照瞬间的闪光）；前置没有灯，用整屏变白补光

  var LIGHT_KEY = "t9cam.light";

  var torchCap = false, torchOn = false;

    Array.prototype.forEach.call(el.lseg.children, function (b) { b.classList.toggle("active", b.dataset.l === lightMode); });
    el.lightNote.textContent = front
      ? "前置摄像头没有补光灯，改用屏幕补光：拍照瞬间整屏变白照亮物体（只对近处有效）。「常亮」在前置时等同于每次拍照都补光。"

  // 拍照前按需补光；返回 { info, restore }，restore 可重复调用
  async function prepareLight(override) {
    var mode = { off: 1, auto: 1, on: 1 }[override] ? override : lightMode;
    var info = { mode: mode, used: "none", lumaBefore: L ? L.luma : null };
    var restore = function () {};
    var want = mode === "on" || (mode === "auto" && L != null && L.luma < AUTO_DARK_LUMA);
    if (facing === "user") {
      if (want) {
        el.screenFill.classList.add("on"); info.used = "screen";
        await sleep(450);   // 等摄像头按新的亮度调好曝光
        restore = function () { el.screenFill.classList.remove("on"); };

    } else if (torchCap) {

    }

  // 看门狗：iOS 在锁屏、来电、Siri、其它应用占用音频、页面再申请麦克风等情况下会「中断」摄像头——

  setInterval(function () {

    var dead = !tr || tr.readyState === "ended";
    var t = srcVideo.currentTime;

    dog.t = t;

        say("摄像头被占用或被系统停用：请关掉其它用摄像头的应用，再点一下画面刷新");
        report("看门狗放弃：一分钟内重开 3 次仍不行");
        return;
      }
      dog.tries.push(now);
      console.log("摄像头画面中断，自动重开", dead ? "ended" : "stalled");
      report("看门狗重开摄像头：" + (dead ? "轨道结束" : (tr && tr.muted ? "轨道静音" : "画面停住")) + " t=" + t);
      say("摄像头被系统中断，正在自动恢复…");

  // =====================================================================
  //  拍照：原始分辨率帧 + 拍摄瞬间的全部传感器
  // =====================================================================

    c.width = rot ? vh : vw; c.height = rot ? vw : vh;
    var ctx = c.getContext("2d", { alpha: false });
    ctx.translate(c.width / 2, c.height / 2);
    if (rot) ctx.rotate(Math.PI / 2);
    ctx.drawImage(srcVideo, -vw / 2, -vh / 2, vw, vh);
    return c;
  }

  // 画面质量：亮度、过曝/欠曝比例、清晰度（拉普拉斯方差，越大越清晰）

          reqBusy = false;
          lastActive = Date.now();
          setTimeout(function () { el.count.classList.remove("on"); }, 1400);
          continue;
        }
      } catch (e) {
        if (!reqBusy) setConn(false);
        if (reqBusy) { reqBusy = false; report("处理请求出错：" + (e && e.message ? e.message : e)); }
        /* 否则多半是电脑暂时连不上，稍后再试 */
      }
      // 服务端立刻返回（页面在后台 / 出错）时别空转：至少隔 1 秒
      var spent = Date.now() - t0;
      if (spent < 1000) await sleep(1000 - spent);
    }
  }
  pollLoop();

  // =====================================================================
  //  封面：在线时每分钟发一张小图（长边 360），只用来在电脑设置页显示「这台手机在线、现在对着哪儿」。
  //  不进照片库，Claude 拿不到。挪动手机、换了摄像头会提前更新；拍照、实时取景时不发。
  // =====================================================================
  var cover = { at: 0, facing: null, pose: null, since: 0, busy: false, force: false, req: null };
  function coverMoved(p) {
    if (!cover.at || cover.facing !== facing) return true;
    if (!p || !cover.pose) return false;
    var dr = Math.abs(((p.horizonRollDeg - cover.pose.r) % 360 + 540) % 360 - 180);
    return Math.abs(p.tiltFromDownDeg - cover.pose.t) > 12 || (p.mode === "平视" && dr > 20);
  }
  setInterval(async function () {
    var now = Date.now(), s = shake(), p = pose();
    var ready = document.visibilityState === "visible" && srcVideo && srcVideo.videoWidth && running &&
                !reqBusy && !snapBusy && !Object.keys(LIVE).length;
    if (!ready) { cover.since = 0; return; }
    if (cover.busy) return;
    if (!cover.force) {   // 电脑上点了「刷新画面」就马上截，不等放稳、不管多久前截过
      if (s && s.verdict !== "稳定") { cover.since = 0; return; }
      if (!cover.since) cover.since = now;
      if (now - cover.since < 2500) return;
      if (!coverMoved(p) && now - cover.at < 60000) return;
      if (cover.at && now - cover.at < 20000) return;   // 别太频繁
    }
    cover.busy = true;
    try {
      var c = grabFrame(); if (!c) return;
      var blob = await new Promise(function (r) { scaled(c, 360).toBlob(r, "image/jpeg", 0.6); });
      var r = await fetch(apiBase() + "/api/phone/cover", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: phoneId, jpegBase64: await blobToB64(blob) }) });
      if (r.ok) { cover.force = false; cover.at = Date.now(); cover.facing = facing; cover.pose = p ? { t: p.tiltFromDownDeg, r: p.horizonRollDeg } : null; }
      else cover.since = Date.now();   // 还没登记上：等一会儿再试
    } catch (e) { cover.since = Date.now(); }
    finally { cover.busy = false; }
  }, 1000);

  // =====================================================================
  //  取景：电脑设置页点「取景」时才发送（视频走局域网直连电脑浏览器，不经过电脑上的服务）
  //  电脑那边关掉、超时、或本页切到后台，会话就会从轮询结果里消失，这里随即停止发送
  // =====================================================================
  var LIVE = {};   // sid -> { pc, sender, q }
  var LIVE_Q = { low: { h: 480, bps: 700000, fps: 12 }, high: { h: 720, bps: 1600000, fps: 15 } };
  function liveHave() { return Object.keys(LIVE).sort().join(","); }
  function liveEnc(q) {
    var t = videoTrack(), st = t && t.getSettings ? t.getSettings() : {};
    var short = Math.min(st.width || 1080, st.height || 1920) || 1080, c = LIVE_Q[q] || LIVE_Q.low;
    return { scaleResolutionDownBy: Math.max(1, short / c.h), maxBitrate: c.bps, maxFramerate: c.fps };
  }
  async function liveApplyQ(e, q) {
    e.q = q;
    try {
      var prm = e.sender.getParameters();
      if (!prm.encodings || !prm.encodings.length) prm.encodings = [{}];
      Object.assign(prm.encodings[0], liveEnc(q));
      await e.sender.setParameters(prm);
    } catch (err) { /* 协商完成前可能改不了，之后会再按 q 设置 */ }
  }
  function iceDone(pc, ms) {
    return new Promise(function (r) {
      if (pc.iceGatheringState === "complete") return r();
      var to = setTimeout(r, ms);
      pc.addEventListener("icegatheringstatechange", function () { if (pc.iceGatheringState === "complete") { clearTimeout(to); r(); } });
    });
  }
  // 每一步都限时，卡住时报告卡在哪一步（实测个别安卓会在建立连接时静默卡住）
  function step(name, p, ms) {
    return Promise.race([p, sleep(ms || 8000).then(function () { throw new Error("卡在「" + name + "」超过 " + ((ms || 8000) / 1000) + " 秒"); })]);
  }
  async function liveStart(sid, q) {
    var t = videoTrack();
    if (!t) { report("取景：摄像头还没就绪，稍后重试"); return; }
    if (!window.RTCPeerConnection) { report("取景：这个浏览器不支持实时视频"); return; }
    report("取景：收到电脑请求，开始连接（" + (q === "high" ? "720p" : "480p") + "）");
    var pc = new RTCPeerConnection({ iceServers: [] });   // 同一局域网直连，不需要任何外部服务器
    var e = LIVE[sid] = { pc: pc, sender: null, q: q };
    var where = "准备";
    pc.addEventListener("connectionstatechange", function () {
      if (pc.connectionState === "failed") report("取景：直连失败（手机和电脑之间的网络不通）");
    });
    try {
      try { t.contentHint = "detail"; } catch (x) {}       // 对准细节：清晰度优先于流畅度
      where = "添加画面";
      var tr;
      try { tr = pc.addTransceiver(t, { direction: "sendonly", streams: [rawStream], sendEncodings: [liveEnc(q)] }); }
      catch (x) { tr = pc.addTransceiver(t, { direction: "sendonly", streams: [rawStream] }); }   // 个别浏览器不认编码参数
      e.sender = tr.sender;
      where = "生成连接邀请";
      var offer = await step(where, pc.createOffer());
      where = "设置本地连接";
      await step(where, pc.setLocalDescription(offer));
      where = "收集本机地址";
      await iceDone(pc, 2500);
      where = "发送连接邀请";
      await step(where, fetch(apiBase() + "/api/live/offer", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sid: sid, phone: phoneId, sdp: pc.localDescription.sdp }) }));
      where = "等电脑应答";
      for (var i = 0; i < 4 && LIVE[sid] === e; i++) {
        var j = await step(where, fetch(apiBase() + "/api/live/answer?sid=" + sid + "&wait=10", { cache: "no-store" }).then(function (r) { return r.json(); }), 15000);
        if (j.answer) {
          where = "应用电脑应答";
          await step(where, pc.setRemoteDescription({ type: "answer", sdp: j.answer }));
          await liveApplyQ(e, e.q);
          report("取景：连接信息交换完成");
          return;
        }
        if (j.state === "ended") return;
      }
    } catch (err) { report("取景失败（" + where + "）：" + (err && err.message || err)); }
  }
  function liveStop(sid) {
    var e = LIVE[sid];
    if (!e) return;
    delete LIVE[sid];
    try { e.pc.close(); } catch (x) {}
  }
  function liveSync(list) {
    var want = {};
    (list || []).forEach(function (x) { want[x.sid] = x.q; });
    Object.keys(LIVE).forEach(function (sid) { if (!(sid in want)) liveStop(sid); });
    Object.keys(want).forEach(function (sid) {
      if (!LIVE[sid]) liveStart(sid, want[sid]);
      else if (LIVE[sid].q !== want[sid]) liveApplyQ(LIVE[sid], want[sid]);
    });
  }
  // 摄像头重开（切镜头、关补光灯、画面卡住自动恢复）后，把新的画面接到正在进行的预览上
  function liveReplaceTrack() {
    var t = videoTrack();
    if (!t) return;
    Object.keys(LIVE).forEach(function (sid) {
      var e = LIVE[sid];
      if (e.sender) e.sender.replaceTrack(t).then(function () { return liveApplyQ(e, e.q); }).catch(function () {});
    });
  }
  setTimeout(function () {
    var t = videoTrack(), st = t && t.getSettings ? t.getSettings() : {};
    report("页面打开 page=" + pageId + " 镜头=" + faceName() + " 补光灯=" + (torchCap ? "有" : "无") +
      " 曝光参数=" + (st.iso != null || st.exposureTime != null ? "有" : "无") + " " + navigator.userAgent.slice(0, 90));
  }, 4000);

  // iOS 13+：读取陀螺仪/重力前必须由用户手势触发授权。首次点击页面任意处时申请一次。
  var motionAsked = false;
  function askMotion() {
    if (motionAsked) return;
    motionAsked = true;
    var req = [];
    if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === "function") req.push(DeviceMotionEvent.requestPermission());
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") req.push(DeviceOrientationEvent.requestPermission());
    if (!req.length) return;
    Promise.all(req).then(function (r) {
      delete el.pose.dataset.fixed;
      toast(r.every(function (x) { return x === "granted"; }) ? "姿态传感器已授权" : "姿态传感器未授权，照片将不含角度数据");
    }).catch(function (e) { toast("姿态授权失败：" + e.message); });
  }
  document.addEventListener("click", askMotion, true);
  if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === "function") {
    el.pose.textContent = "姿态：点一下屏幕授权传感器";
    el.pose.dataset.fixed = "1";
  }

  // 从桌面快捷方式打开时仍是普通标签页：点一下画面进入全屏，隐藏地址栏，留更多面积给画面
  document.querySelector(".stage").addEventListener("click", function () {
    var d = document.documentElement;
    if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen({ navigationUI: "hide" }).catch(function () {});
  });

  el.phoneNameSave.addEventListener("click", function () {
    var v = el.phoneName.value.trim().slice(0, 16);
    if (!v) { toast("名称不能为空"); return; }
    phoneName = v; lsSet(PHONE_NAME_KEY, phoneName);
    toast("本机名称：" + phoneName);
    el.phoneName.blur();
  });
  el.torchBtn.addEventListener("click", function () {
    setLightMode(lightMode === "off" ? "auto" : lightMode === "auto" ? "on" : "off");
  });
  el.lseg.addEventListener("click", function (e) {
    var m = e.target.dataset && e.target.dataset.l;
    if (m && m !== lightMode) setLightMode(m);
  });
  el.flip.addEventListener("click", function () { selectFacing(facing === "user" ? "environment" : "user"); });
  el.more.addEventListener("click", function () { openSheet(true); });
  el.mask.addEventListener("click", function () { openSheet(false); });
  el.camFront.addEventListener("click", function () { selectFacing("user"); });
  el.camBack.addEventListener("click", function () { selectFacing("environment"); });
  el.qseg.addEventListener("click", function (e) {
    var q = e.target.dataset && e.target.dataset.q;
    if (!q || q === quality) return;
    quality = q; lsSet(QUALITY_KEY, q); syncUI(); toast("画质 " + QUALITY[q].label); restartCamera();
  });
  el.gridT.addEventListener("change", function () { lsSet(GRID_KEY, el.gridT.checked ? "1" : "0"); syncUI(); });
  el.mirror.addEventListener("change", syncUI);

  document.addEventListener("visibilitychange", async function () {
    if (document.visibilityState === "hidden") { if (rawStream || running) stopCamera(); }
    else {
      await new Promise(function (r) { setTimeout(r, 500); });
      if (document.visibilityState === "visible" && !rawStream) startCamera();
      keepAwake();
    }
  });
  window.addEventListener("beforeunload", stopCamera);

  async function loadConfig() {
    try { cfg = await (await fetch("/config.json", { cache: "no-store" })).json(); } catch (e) { cfg = null; }
    if (cfg && cfg.caSha256) lsSet("t9cam.ca", cfg.caSha256);   // 记住电脑的身份：电脑换了地址时靠它认出来
    el.note.textContent = cfg && cfg.lanIp && cfg.lanIp !== "127.0.0.1"
      ? "通过局域网连接电脑 " + cfg.lanIp
      : "未取到电脑的局域网地址";
  }

  function registerSW() {
    if (!("serviceWorker" in navigator)) { el.offline.textContent = "离线缓存：不支持"; return; }
    navigator.serviceWorker.register("sw.js").then(function () {
      el.offline.textContent = "离线缓存已就绪 · 拔线后刷新仍可打开";
    }).catch(function (e) { el.offline.textContent = "离线缓存未启用：" + e.message; });
  }

  window.addEventListener("load", async function () {
    el.mirror.checked = facing === "user";
    el.gridT.checked = lsGet(GRID_KEY) === "1";
    syncUI();
    await loadConfig();
    registerSW();
    if (document.visibilityState === "visible") startCamera();
  });
})();
</script>
</body>
</html>
